name: "Docs links"
# External links in the docs break without any change on our side, so they are
# checked on a schedule instead of on every PR. Links between docs pages are
# checked by every docs build (onBrokenLinks: "throw").
#
# Broken links are listed in one open issue, updated on every run and closed
# once all links work again.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-links
  cancel-in-progress: true

env:
  ISSUE_TITLE: "Broken links in the docs"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔗 Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          workingDirectory: apps/docs
          # Only http(s) links: root-relative links resolve to static/ and
          # are left out with the other file links. Many publishers answer
          # link checkers with 403, 406 or 429 although the page exists.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/apps/docs/static
            --scheme https --scheme http
            --accept 100..=103,200..=299,403,406,429
            --exclude 'youtube\.com/embed/VIDEO_ID'
            --max-concurrency 16 --timeout 20 --max-retries 2
            'docs/**/*.md*' 'tutorials/**/*.md*' 'i18n/**/*.md*'
            'src/**/*.js' 'src/**/*.tsx' docusaurus.config.js
          output: ${{ runner.temp }}/lychee.md
          fail: false

      - name: 📝 Report in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          REPORT: ${{ runner.temp }}/lychee.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 0 = all links work, 2 = broken links; anything else is lychee failing.
          if [ "$EXIT_CODE" != 0 ] && [ "$EXIT_CODE" != 2 ]; then
            echo "::error::lychee exited with $EXIT_CODE"
            exit 1
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")

          if [ "$EXIT_CODE" = 0 ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "All links work again ($RUN_URL)."
            fi
            exit 0
          fi

          # Issue bodies are limited to 65536 characters.
          body="$RUNNER_TEMP/issue.md"
          {
            echo "Found by the weekly link check: $RUN_URL"
            echo
            head -c 60000 "$REPORT"
          } > "$body"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$body"
          fi
