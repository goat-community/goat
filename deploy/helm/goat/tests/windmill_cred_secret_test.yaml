suite: Windmill Postgres credential Secret
templates:
  - postgresql/windmill-cred-secret.yaml
tests:
  - it: not rendered when the cluster isn't chart-managed
    set:
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - hasDocuments:
          count: 0

  - it: not rendered when windmill reuses the goat connection
    set:
      postgresql.cluster.enabled: true
      windmill.db.reuseGoatConnection: true
    asserts:
      - hasDocuments:
          count: 0

  - it: rendered independently of windmill.server.enabled
    set:
      postgresql.cluster.enabled: true
      windmill.server.enabled: false
      windmill.workers.default.enabled: false
      windmill.db.reuseGoatConnection: false
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-pg-windmill-cred
      - equal:
          path: stringData.username
          value: windmill_owner_user
      - equal:
          path: type
          value: kubernetes.io/basic-auth
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: still rendered when windmill.server is enabled (unaffected either way)
    set:
      postgresql.cluster.enabled: true
      windmill.server.enabled: true
      windmill.db.reuseGoatConnection: false
    asserts:
      - isKind:
          of: Secret
