suite: catalog Service
templates:
  - catalog/service.yaml
tests:
  - it: exposes port 80 targeting the http port
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-catalog
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
  - it: not rendered when catalog.enabled false
    set:
      catalog.enabled: false
    asserts:
      - hasDocuments:
          count: 0
