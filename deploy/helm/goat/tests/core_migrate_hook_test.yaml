suite: core migrate hook
templates:
  - core/migrate-hook.yaml
  - core/configmap.yaml          # needed so envFrom refs validate
tests:
  - it: renders the hook Job by default with hook annotations
    set:
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    template: core/migrate-hook.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-core-migrate
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/plan4better/goat/core:.+"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "alembic upgrade head"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "core.scripts.initial_data"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: pg-secret
                key: username

  - it: is absent when core.migrate.enabled is false
    set:
      core.migrate.enabled: false
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    template: core/migrate-hook.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: is absent when core itself is disabled
    set:
      core.enabled: false
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    template: core/migrate-hook.yaml
    asserts:
      - hasDocuments:
          count: 0

  # core's settings refuse AUTH on without KEYCLOAK_SERVER_URL, so the hook
  # needs the Keycloak env the Deployment gets from the auth Secret.
  - it: gets core's Keycloak settings from the auth Secret
    set:
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
      global.auth.enabled: true
      global.auth.existingSecret: "kc-secret"
    template: core/migrate-hook.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_SERVER_URL
            valueFrom:
              secretKeyRef:
                name: kc-secret
                key: server-url
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REALM_NAME
            valueFrom:
              secretKeyRef:
                name: kc-secret
                key: realm
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: kc-secret
                key: client-id

  - it: gets core.extraEnv, which then wins over the auth Secret
    set:
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
      global.auth.enabled: true
      global.auth.existingSecret: "kc-secret"
      core.extraEnv:
        - name: KEYCLOAK_SERVER_URL
          value: "https://idm.example.com"
    template: core/migrate-hook.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_SERVER_URL
            value: "https://idm.example.com"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_SERVER_URL
            valueFrom:
              secretKeyRef:
                name: kc-secret
                key: server-url

  - it: has no Keycloak env with auth off
    set:
      postgresql.cluster.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
      global.auth.enabled: false
      global.auth.existingSecret: "kc-secret"
    template: core/migrate-hook.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEYCLOAK_SERVER_URL
            valueFrom:
              secretKeyRef:
                name: kc-secret
                key: server-url
