suite: geoapi Deployment
templates:
  - geoapi/deployment.yaml
  - geoapi/configmap.yaml
tests:
  - it: renders Deployment with default image
    set:
      geoapi.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    template: geoapi/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-geoapi
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/plan4better/goat/geoapi:.+"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
  - it: not rendered when geoapi.enabled false
    set:
      geoapi.enabled: false
    template: geoapi/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: mounts the shared data volume read-write and keeps extraVolumes
    template: geoapi/deployment.yaml
    set:
      geoapi.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
      geoapi.extraVolumes:
        - name: ca-bundle
          configMap:
            name: my-ca
      geoapi.extraVolumeMounts:
        - name: ca-bundle
          mountPath: /etc/ssl/custom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: goat-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/data
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: ca-bundle
      - equal:
          path: spec.template.spec.volumes[0].name
          value: goat-data
      - equal:
          path: spec.template.spec.volumes[1].name
          value: ca-bundle
  - it: mounts nothing when the data volume is disabled
    template: geoapi/deployment.yaml
    set:
      geoapi.enabled: true
      data.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
