{{- if .Values.windmill.workers.tools.enabled -}}
{{- $component := "windmill-worker-tools" -}}
{{- $ctx := dict "context" . "component" $component -}}
{{- $worker := .Values.windmill.workers.tools -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goat.serviceFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "goat.serviceSelectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        {{- include "goat.serviceSelectorLabels" $ctx | nindent 8 }}
        {{- with $worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "goat.windmillDbInit.enabled" . }}
      initContainers:
        {{- include "goat.windmillDbInit.container" . | nindent 8 }}
      {{- end }}
      containers:
        - name: windmill-worker-tools
          image: {{ include "goat.image" (dict "image" $worker.image "global" .Values.global "root" $) }}
          imagePullPolicy: {{ $worker.image.pullPolicy }}
          {{- with $worker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "goat.serviceFullname" $ctx }}
          env:
            # Windmill's connection to its own DB. We use namespaced names
            # (_WMILL_DB_*) so that the POSTGRES_* namespace stays free for
            # operator-supplied env consumed by user scripts (goatlib reads
            # POSTGRES_USER/POSTGRES_PASSWORD for the *application* DB, which
            # is generally NOT the same as the windmill DB).
            - name: _WMILL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "windmill.postgresql.secretName" . }}
                  key: {{ include "windmill.postgresql.userKey" . }}
            - name: _WMILL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "windmill.postgresql.secretName" . }}
                  key: {{ include "windmill.postgresql.passwordKey" . }}
            - name: DATABASE_URL
              value: "postgres://$(_WMILL_DB_USER):$(_WMILL_DB_PASSWORD)@{{ include "windmill.postgresql.host" . }}:{{ include "windmill.postgresql.port" . }}/{{ include "windmill.postgresql.database" . }}?sslmode=prefer"
            # GOAT's settings for the jobs this worker runs, and the
            # WHITELIST_ENVS that hands them on (_storage_workers.tpl).
            {{- include "goat.worker.env" (dict "root" $ "values" $worker) | trim | nindent 12 }}
            {{- with $worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $caBundle := include "goat.caBundle.enabled" $ }}
          {{- if or .Values.data.enabled $worker.persistence.enabled $caBundle }}
          volumeMounts:
            {{- if .Values.data.enabled }}
            {{- include "goat.data.mounts.full" . | nindent 12 }}
            {{- else if $worker.persistence.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if $caBundle }}
            {{- include "goat.caBundle.mount" $ | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.data.enabled $worker.persistence.enabled $caBundle }}
      volumes:
        {{- if .Values.data.enabled }}
        {{- include "goat.data.volume" . | nindent 8 }}
        {{- else if $worker.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $worker.persistence.existingClaim | default (printf "%s-windmill-tools-data" (include "goat.fullname" .)) }}
        {{- end }}
        {{- if $caBundle }}
        {{- include "goat.caBundle.volume" $ | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
