{{- /*
Holds the desired superadmin password the bootstrap hook will rotate the
default `changeme` to. Auto-generated once on first install (random 32-char
alphanum), preserved across upgrades via the lookup + `resource-policy: keep`
pattern. Operator can supply their own by setting
`windmill.bootstrap.adminPasswordSecret.name` to an existing Secret.
*/}}
{{- if and .Values.windmill.server.enabled .Values.windmill.bootstrap.enabled (not .Values.windmill.bootstrap.adminPasswordSecret.name) -}}
{{- $secretName := printf "%s-windmill-admin-cred" (include "goat.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "windmill-bootstrap") | nindent 4 }}
  annotations:
    # Keep the password across uninstall/reinstall so the bootstrap hook can
    # always log in. CNPG keeps the DB; losing the password would lock us out.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end -}}
