{{- if .Values.windmill.server.enabled -}}
{{- $component := "windmill-server" -}}
{{- $ctx := dict "context" . "component" $component -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goat.serviceFullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.windmill.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "goat.serviceSelectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        {{- include "goat.serviceSelectorLabels" $ctx | nindent 8 }}
        {{- with .Values.windmill.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.windmill.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.windmill.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "goat.windmillDbInit.enabled" . }}
      initContainers:
        {{- include "goat.windmillDbInit.container" . | nindent 8 }}
      {{- end }}
      containers:
        - name: windmill-server
          image: {{ include "goat.image" (dict "image" .Values.windmill.server.image "global" .Values.global "root" $) }}
          imagePullPolicy: {{ .Values.windmill.server.image.pullPolicy }}
          {{- with .Values.windmill.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.windmill.server.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "goat.serviceFullname" $ctx }}
          env:
            # Windmill's connection to its own DB. We use namespaced names
            # (_WMILL_DB_*) so that the POSTGRES_* namespace stays free for
            # operator-supplied env consumed by user scripts (goatlib reads
            # POSTGRES_USER/POSTGRES_PASSWORD for the *application* DB, which
            # is generally NOT the same as the windmill DB).
            - name: _WMILL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "windmill.postgresql.secretName" . }}
                  key: {{ include "windmill.postgresql.userKey" . }}
            - name: _WMILL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "windmill.postgresql.secretName" . }}
                  key: {{ include "windmill.postgresql.passwordKey" . }}
            - name: DATABASE_URL
              value: "postgres://$(_WMILL_DB_USER):$(_WMILL_DB_PASSWORD)@{{ include "windmill.postgresql.host" . }}:{{ include "windmill.postgresql.port" . }}/{{ include "windmill.postgresql.database" . }}?sslmode=prefer"
            {{- with .Values.windmill.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.windmill.server.livenessProbe.enabled }}
          livenessProbe:
            {{- $lp := omit .Values.windmill.server.livenessProbe "enabled" }}
            {{- toYaml $lp | nindent 12 }}
          {{- end }}
          {{- if .Values.windmill.server.readinessProbe.enabled }}
          readinessProbe:
            {{- $rp := omit .Values.windmill.server.readinessProbe "enabled" }}
            {{- toYaml $rp | nindent 12 }}
          {{- end }}
          {{- with .Values.windmill.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.windmill.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.windmill.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.windmill.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
