{{- if .Values.windmill.workers.default.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.serviceFullname" (dict "context" . "component" "windmill-worker-default") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "windmill-worker-default") | nindent 4 }}
data:
  {{- range $k, $v := .Values.windmill.workers.default.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if not (include "goat.env.userSet" (dict "values" .Values.windmill.workers.default "key" "DATABASE_CONNECTIONS")) }}
  DATABASE_CONNECTIONS: {{ .Values.windmill.workers.databaseConnections | quote }}
  {{- end }}
{{- end }}
