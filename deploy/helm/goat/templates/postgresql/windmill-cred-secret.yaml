{{- /*
CNPG's `managed.roles[].passwordSecret` reads the password from a K8s Secret
that the operator (us) must create. We materialize that secret here in
chart-managed mode, generating the password once on first install and
preserving it on upgrade via the standard `lookup` pattern.

The secret also satisfies the chart's `windmill.postgresql.secretName`
helper, which defaults to the same name when cluster mode is on.

Deliberately NOT gated on .Values.windmill.server.enabled (see the matching
note on $needsWindmillDB in postgresql/cluster.yaml): this role/secret must
exist independently of whether the windmill server is currently on, so that
turning it on later doesn't depend on timing relative to the cluster's
original bootstrap.
*/}}
{{- if and .Values.postgresql.cluster.enabled (not .Values.windmill.db.reuseGoatConnection) -}}
{{- $clusterName := printf "%s-pg" (include "goat.fullname" .) -}}
{{- $secretName := printf "%s-windmill-cred" $clusterName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data $existing.data.password -}}
{{- $password = $existing.data.password | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "postgresql") | nindent 4 }}
  annotations:
    # `helm.sh/resource-policy: keep` ensures the password survives a helm
    # uninstall + reinstall — the CNPG cluster's data persists in the PVC,
    # so re-rotating the password on reinstall would lock us out.
    "helm.sh/resource-policy": keep
type: kubernetes.io/basic-auth
stringData:
  username: windmill_owner_user
  password: {{ $password | quote }}
{{- end -}}
