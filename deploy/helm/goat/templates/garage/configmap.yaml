{{- if .Values.garage.enabled -}}
{{- $ctx := dict "context" . "component" "garage" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.garage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" $ctx | nindent 4 }}
data:
  # Single-node Garage, as in the compose bundle. rpc_secret and admin_token
  # come from GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN.
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    # No root_domain: GOAT addresses buckets by path.

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.internal"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
{{- end -}}
