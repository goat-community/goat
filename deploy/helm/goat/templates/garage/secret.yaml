{{- /*
Garage's rpc secret and admin token, and (when global.s3.existingSecret is
empty) the S3 key pair GOAT and Garage share. Generated on first install and
read back on every upgrade, so they stay the same. Garage expects key ids of
"GK" and 24 hex digits and secrets of 64 hex digits.
*/}}
{{- if .Values.garage.enabled -}}
{{- $ctx := dict "context" . "component" "garage" -}}
{{- if not .Values.garage.existingSecret }}
{{- $name := include "goat.garage.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  rpc-secret: {{ (index $data "rpc-secret" | default "" | b64dec) | default (printf "%s%s" (uuidv4 | replace "-" "") (uuidv4 | replace "-" "")) | quote }}
  admin-token: {{ (index $data "admin-token" | default "" | b64dec) | default (printf "%s%s" (uuidv4 | replace "-" "") (uuidv4 | replace "-" "")) | quote }}
{{- end }}
{{- if not (.Values.global.s3 | default dict).existingSecret }}
{{- $name := include "goat.garage.keySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ (index $data "access-key-id" | default "" | b64dec) | default (printf "GK%s" (uuidv4 | replace "-" "" | trunc 24)) | quote }}
  secret-access-key: {{ (index $data "secret-access-key" | default "" | b64dec) | default (printf "%s%s" (uuidv4 | replace "-" "") (uuidv4 | replace "-" "")) | quote }}
{{- end }}
{{- end -}}
