{{- /*
The password of the bundled Redis, generated on first install and read back
on every upgrade, so it stays the same. `redis.auth.existingSecret` replaces
it for tools that render the chart without cluster access (Argo CD, `helm
template`): they cannot read it back and would generate a new one each time.
*/}}
{{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) -}}
{{- $name := include "goat.redis.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data "redis-password") -}}
{{- $password = index $existing.data "redis-password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "redis") | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ $password | quote }}
{{- end -}}
