# Single-node Garage. rpc_secret and admin_token come from the
# GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN environment variables.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
# No root_domain: GOAT addresses buckets by path. A root_domain that is a
# parent of the public hostname would turn the hostname into a bucket name.

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.internal"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
