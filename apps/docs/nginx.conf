# PRODUCTION NGINX CONFIGURATION #
gzip on;
gzip_disable "msie6";
gzip_types text/plain text/markdown text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Pages change with every build; everything else keeps nginx's defaults.
map $sent_http_content_type $docs_expires {
  ~^text/html 5m;
  default off;
}

map $uri $docs_not_found {
  ~^/docs/de/ /docs/de/404.html;
  default /docs/404.html;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html;

  # Redirects carry only the path, so they keep the scheme and host the
  # request came in on behind the ingress.
  absolute_redirect off;

  charset utf-8;
  charset_types text/html text/plain text/markdown text/css application/javascript application/json;
  expires $docs_expires;
  error_page 404 $docs_not_found;

  location = /docs {
    return 301 /docs/;
  }

  location = /docs/de {
    return 301 /docs/de/;
  }

  # Release notes live in the GOAT changelog on the Plan4Better website.
  location ~ ^/docs/de/(?:2\.0/)?releases(?:/|$) {
    return 301 https://www.plan4better.de/de/goat/changelog/;
  }

  location ~ ^/docs/(?:2\.0/)?releases(?:/|$) {
    return 301 https://www.plan4better.de/en/goat/changelog/;
  }

  # The blog lives on the Plan4Better website.
  location ~ ^/docs/(?:de/)?(?:2\.0/)?blog(?:/|$) {
    return 301 https://www.plan4better.de/en/blog/;
  }

  # The site is built with `trailingSlash: false`: `/docs/foo/` redirects to
  # `/docs/foo`. The site root and the locale roots keep their slash.
  location ~ ^/docs/(?!(?:de/)?$)(.+)/$ {
    return 301 /docs/$1$is_args$args;
  }

  location ~ ^/docs/(?:de/)?assets/ {
    # Bundled assets include a digest in the filename, so they never change
    expires max;
  }

  location ~* \.md$ {
    # Markdown source of each doc page, written by src/plugins/markdown-source.js
    default_type text/markdown;
    expires 5m;
  }

  location ~* \.txt$ {
    # llms.txt and llms-full.txt, written by src/plugins/markdown-source.js
    default_type text/plain;
    expires 5m;
  }

  # `/docs/foo` is served from `foo.html`; the site root and the locale roots
  # from their `index.html`.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
}
