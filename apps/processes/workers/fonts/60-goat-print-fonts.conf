<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The layout font picker (apps/web/lib/constants/typography.ts, FONT_FAMILIES)
  offers fonts the print worker has no file of. Each open font below stands in
  for one of them under that font's name. Chromium takes a fontconfig match
  only when it carries the requested family name (or is one of its built-in
  metric-compatible pairs, like Arial and Liberation Sans), and ignores plain
  <alias> substitutes, so the name is added to the font itself at scan time.
  Trebuchet MS has no entry: Liberation Sans, which the generic sans-serif
  gives it, is already the closest in width. Georgia has none either:
  Gelasio, the open font drawn to its metrics, is not packaged by Debian, so
  Georgia prints in the generic serif, Liberation Serif.
-->
<fontconfig>
  <!-- Verdana: DejaVu Sans matches its width, regular and bold. -->
  <match target="scan">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="append"><string>Verdana</string></edit>
  </match>
  <!-- Garamond: EB Garamond, an open revival of the same typeface. -->
  <match target="scan">
    <test name="family"><string>EB Garamond</string></test>
    <edit name="family" mode="append"><string>Garamond</string></edit>
  </match>
  <!-- Consolas: Inconsolata, a monospace font of the same kind. -->
  <match target="scan">
    <test name="family"><string>Inconsolata</string></test>
    <edit name="family" mode="append"><string>Consolas</string></edit>
  </match>
  <!-- Generic monospace would otherwise land on the CJK font Playwright's
       dependencies install, which draws Latin text in its own design. -->
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
